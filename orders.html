<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Orders — ACH Boutique</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<style>
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
.filter-btn{padding:7px 16px;border:1px solid var(--stone);border-radius:20px;font-size:13px;background:var(--white);cursor:pointer;transition:.15s;}
.filter-btn:hover,.filter-btn.active{background:var(--charcoal);color:#fff;border-color:var(--charcoal);}
.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.search-bar input{flex:1;padding:10px 16px;border:1px solid var(--stone);border-radius:8px;font-size:14px;background:var(--ivory);}
.order-card{background:var(--white);border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 12px rgba(58,46,56,.05);border:1px solid var(--stone);}
.order-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:12px;}
.order-head:hover{background:var(--blush);}
.order-id{font-size:12px;color:#8a7480;font-family:monospace;}
.order-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.order-date{font-size:12px;color:#8a7480;}
.order-total{font-weight:600;font-size:15px;}
.expand-icon{font-size:18px;color:#8a7480;transition:transform .2s;}
.order-card.open .expand-icon{transform:rotate(180deg);}
.order-body{display:none;padding:0 20px 20px;border-top:1px solid var(--stone);}
.order-card.open .order-body{display:block;}
.items-list{margin:16px 0;}
.item-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--stone);}
.item-row:last-child{border-bottom:none;}
.item-img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--blush);}
.item-info{flex:1;}
.item-name{font-size:14px;font-weight:500;}
.item-meta{font-size:12px;color:#8a7480;margin-top:2px;}
.item-price{font-size:14px;font-weight:600;}
.order-summary{background:var(--ivory);border-radius:10px;padding:14px;font-size:13px;}
.summary-row{display:flex;justify-content:space-between;padding:3px 0;}
.summary-row.total{font-weight:600;font-size:15px;border-top:1px solid var(--stone);margin-top:6px;padding-top:8px;}
.tracking-box{background:var(--blush);border-radius:10px;padding:14px;margin-top:14px;}
.tracking-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--rose);margin-bottom:6px;}
.tracking-steps{display:flex;gap:0;margin-top:10px;}
.t-step{flex:1;text-align:center;position:relative;}
.t-step::before{content:'';position:absolute;top:12px;left:50%;width:100%;height:2px;background:var(--stone);}
.t-step:last-child::before{display:none;}
.t-dot{width:24px;height:24px;border-radius:50%;background:var(--stone);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;z-index:1;}
.t-dot.done{background:var(--moss);color:#fff;}
.t-dot.current{background:var(--rose);color:#fff;}
.t-label{font-size:10px;color:#8a7480;}
.action-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.empty-state{text-align:center;padding:60px 20px;}
.empty-state .ico{font-size:56px;margin-bottom:16px;}
.empty-state h2{font-family:'Fraunces',serif;font-size:24px;margin-bottom:8px;}
.empty-state p{font-size:14px;color:#8a7480;margin-bottom:24px;}
</style>
</head>
<body>
<script>document.write(ACH_THEME);</script>

<nav class="site-nav">
  <a href="shop.html" class="logo">ACH Boutique</a>
  <div class="nav-links">
    <a href="shop.html">Shop</a>
    <a href="orders.html" class="active">My Orders</a>
    <a href="account.html">Account</a>
  </div>
  <div class="nav-icons">
    <a href="account.html" class="icon-btn">👤</a>
    <a href="shop.html" class="icon-btn">🛍</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-title">My Orders</div>
  <div class="page-sub" id="orderCount">Loading your orders…</div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search by order ID or product name…" oninput="filterOrders()">
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('Placed',this)">Placed</button>
    <button class="filter-btn" onclick="setFilter('Processing',this)">Processing</button>
    <button class="filter-btn" onclick="setFilter('Shipped',this)">Shipped</button>
    <button class="filter-btn" onclick="setFilter('Delivered',this)">Delivered</button>
    <button class="filter-btn" onclick="setFilter('Cancelled',this)">Cancelled</button>
  </div>

  <div id="ordersList"></div>
</div>

<script>
let allOrders = [];
let activeFilter = 'all';
let searchQuery = '';

auth.onAuthStateChanged(async user => {
  if(!user){ location.href='login.html?next=orders.html'; return; }
  await loadOrders(user.uid);
});

async function loadOrders(uid){
  try{
    const snap = await db.collection('orders')
      .where('uid','==',uid)
      .orderBy('date','desc')
      .get();
    allOrders = snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    // fallback: try without uid filter (for orders placed before auth)
    try{
      const user = auth.currentUser;
      const phone = user.phoneNumber;
      if(phone){
        const snap2 = await db.collection('orders')
          .where('customer.phone','==',phone.replace('+91',''))
          .orderBy('date','desc').get();
        allOrders = snap2.docs.map(d=>({id:d.id,...d.data()}));
      }
    }catch(e2){ console.warn(e2); }
  }
  document.getElementById('orderCount').textContent =
    allOrders.length===0 ? 'No orders yet' : `${allOrders.length} order${allOrders.length>1?'s':''}`;
  renderOrders();
}

function setFilter(f, el){
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderOrders();
}
function filterOrders(){
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  renderOrders();
}

function renderOrders(){
  let orders = allOrders;
  if(activeFilter!=='all') orders = orders.filter(o=>o.status===activeFilter);
  if(searchQuery) orders = orders.filter(o=>
    o.id.toLowerCase().includes(searchQuery) ||
    (o.items||[]).some(i=>i.name.toLowerCase().includes(searchQuery))
  );

  if(orders.length===0){
    document.getElementById('ordersList').innerHTML = `
      <div class="empty-state">
        <div class="ico">📦</div>
        <h2>${activeFilter==='all' && !searchQuery ? "No orders yet" : "No orders found"}</h2>
        <p>${activeFilter==='all' && !searchQuery ? "Looks like you haven't placed any orders. Time to shop!" : "Try a different filter or search term."}</p>
        <a href="shop.html" class="btn">Start Shopping</a>
      </div>`;
    return;
  }

  document.getElementById('ordersList').innerHTML = orders.map(o=>orderCard(o)).join('');
}

function orderCard(o){
  const statusSteps = ['Placed','Processing','Shipped','Delivered'];
  const curStep = statusSteps.indexOf(o.status);
  const stepsHtml = statusSteps.map((s,i)=>`
    <div class="t-step">
      <div class="t-dot ${i<curStep?'done':i===curStep?'current':''}">
        ${i<curStep?'✓':i===curStep?'●':'○'}
      </div>
      <div class="t-label">${s}</div>
    </div>`).join('');

  const itemsHtml = (o.items||[]).map(item=>`
    <div class="item-row">
      <div class="item-img" style="background:var(--blush);display:flex;align-items:center;justify-content:center;font-size:22px;">👗</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-meta">Size: ${item.size} · Qty: ${item.qty}</div>
      </div>
      <div class="item-price">₹${(item.price*item.qty).toLocaleString('en-IN')}</div>
    </div>`).join('');

  const discount = o.discount>0 ? `<div class="summary-row"><span>Discount</span><span style="color:var(--moss)">−₹${o.discount.toLocaleString('en-IN')}</span></div>` : '';
  const shipping = `<div class="summary-row"><span>Shipping</span><span>${o.shipping>0?'₹'+o.shipping:'Free'}</span></div>`;
  const gst = o.gstApplied ? `<div class="summary-row"><span>GST</span><span>₹${(o.gst||0).toLocaleString('en-IN')}</span></div>` : '';

  const trackingHtml = o.trackingNumber ? `
    <div class="tracking-box">
      <div class="tracking-label">Shipment Tracking</div>
      <div style="font-size:13px;">Courier: <b>${o.courierName||'—'}</b> · AWB: <b>${o.trackingNumber}</b></div>
      <div style="font-size:12px;color:#8a7480;margin-top:4px;">Shipped ${o.shippedAt?new Date(o.shippedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):''}</div>
    </div>` : '';

  return `
  <div class="order-card" id="oc-${o.id}">
    <div class="order-head" onclick="toggleOrder('${o.id}')">
      <div>
        <div class="order-id">${o.id}</div>
        <div class="order-date">${new Date(o.date).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
      <div class="order-meta">
        <span class="badge ${(o.status||'').toLowerCase()}">${o.status||'Placed'}</span>
        <span class="order-total">₹${(o.total||0).toLocaleString('en-IN')}</span>
      </div>
      <div class="expand-icon">⌄</div>
    </div>
    <div class="order-body">
      ${o.status!=='Cancelled' ? `<div class="tracking-steps">${stepsHtml}</div>` : '<div style="padding:12px 0;font-size:13px;color:#b5473a;">This order was cancelled.</div>'}
      ${trackingHtml}
      <div class="items-list">${itemsHtml}</div>
      <div class="order-summary">
        <div class="summary-row"><span>Subtotal</span><span>₹${(o.subtotal||0).toLocaleString('en-IN')}</span></div>
        ${discount}${shipping}${gst}
        <div class="summary-row total"><span>Total</span><span>₹${(o.total||0).toLocaleString('en-IN')}</span></div>
        <div style="font-size:12px;color:#8a7480;margin-top:8px;">Payment: ${o.payment} · ${o.paymentStatus||''}</div>
      </div>
      <div class="action-row">
        <a href="track.html?id=${o.id}" class="btn btn-outline" style="font-size:13px;padding:8px 18px;">Track Order</a>
        ${o.status==='Delivered'?`<button class="btn btn-outline" style="font-size:13px;padding:8px 18px;" onclick="reorder('${o.id}')">Reorder</button>`:''}
        ${(o.status==='Placed'||o.status==='Processing')?`<button class="mini-btn danger" onclick="cancelOrder('${o.id}')">Cancel Order</button>`:''}
      </div>
    </div>
  </div>`;
}

function toggleOrder(id){
  document.getElementById('oc-'+id).classList.toggle('open');
}

async function cancelOrder(id){
  if(!confirm('Cancel this order? This cannot be undone.')) return;
  try{
    await db.collection('orders').doc(id).update({status:'Cancelled',paymentStatus:'Cancelled'});
    showToast('Order cancelled.');
    const o = allOrders.find(o=>o.id===id);
    if(o){ o.status='Cancelled'; o.paymentStatus='Cancelled'; }
    renderOrders();
  }catch(e){ showToast('Could not cancel. Please contact support.'); }
}

async function reorder(id){
  const o = allOrders.find(o=>o.id===id);
  if(!o) return;
  // add items to cart in localStorage
  const cart = JSON.parse(localStorage.getItem('ach_cart')||'[]');
  (o.items||[]).forEach(i=>{
    cart.push({productId:i.productId||i.name, size:i.size, qty:i.qty});
  });
  localStorage.setItem('ach_cart', JSON.stringify(cart));
  location.href='shop.html';
}
</script>
</body>
</html>
